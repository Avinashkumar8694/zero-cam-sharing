server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # camera access is the point of the app: allow it for this origin only
  add_header Permissions-Policy "camera=(self)" always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # installers made by build_all.sh (APK, DMG, EXE, AppImage): served from the downloads volume
  location /downloads/ { autoindex off; add_header Content-Disposition attachment; try_files $uri =404; }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # single-page app
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
