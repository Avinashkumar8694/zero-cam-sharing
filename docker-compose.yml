services:
  traefik:
    image: "traefik:v3.0"
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped

  fabrixly-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fabrixly-home
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fabrixly.rule=PathPrefix(`/`)"
      - "traefik.http.routers.fabrixly.entrypoints=web"
      - "traefik.http.services.fabrixly.loadbalancer.server.port=80"
    restart: unless-stopped
