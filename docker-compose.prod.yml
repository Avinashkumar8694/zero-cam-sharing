# Production deploy of Fabrixly Cam Sharing on the shared VPS, behind the Traefik proxy.
# Deployed by Jenkins (zero-jenkins: job zero-cam-sharing): builds the Dockerfile, pushes kumaravinit/zero:camshare-web-<version>,
# copies THIS file to ~/services/zero-cam-sharing/docker-compose.yml and runs `docker compose pull && docker compose up -d`.
# The VPS only runs the PUBLISHED image. Traefik gets the Let's Encrypt certificate for cam-share.fabrixly.com (DNS A record needed).
services:
  web:
    image: kumaravinit/zero:camshare-web-1.0.0
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Android / desktop installers from build_all.sh. Fill once:
      #   docker run --rm -v zero-cam-sharing_camshare_downloads:/d -v "$PWD/public/downloads":/s alpine cp -r /s/. /d/
      - camshare_downloads:/usr/share/nginx/html/downloads:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.camshare.rule=Host(`cam-share.fabrixly.com`)"
      - "traefik.http.routers.camshare.entrypoints=web,websecure"
      - "traefik.http.routers.camshare.tls=true"
      - "traefik.http.routers.camshare.tls.certresolver=letsencrypt"
      - "traefik.http.services.camshare.loadbalancer.server.port=80"

volumes:
  camshare_downloads:

networks:
  web:
    external: true
